<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LS20 Lab — Level Editor</title>
<link rel="stylesheet" href="style.css">
<style>
  .ed-wrap{max-width:1200px;margin:0 auto;display:grid;grid-template-columns:minmax(420px,1fr) 320px;gap:16px;}
  .palette{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;}
  .palette button{display:flex;align-items:center;gap:8px;justify-content:flex-start;padding:8px;font-size:12px;}
  .palette button.sel{border-color:var(--accent);color:var(--accent);background:var(--panel2);}
  .swatch{width:18px;height:18px;border:1px solid var(--line);border-radius:3px;display:inline-flex;align-items:center;justify-content:center;font-size:12px;}
  .row{display:flex;gap:8px;align-items:center;margin:6px 0;flex-wrap:wrap;}
  .row label{font-size:12px;color:var(--dim);min-width:52px;}
  .row input[type=number], .row input[type=text], .row select{background:var(--void);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:6px;font-family:inherit;}
  .row input[type=text]{flex:1;}
  #edCanvas{display:block;background:var(--void);border:2px solid var(--line);border-radius:4px;cursor:crosshair;max-width:100%;}
  .attr{display:flex;gap:6px;align-items:center;}
  .miniwrap{display:flex;gap:16px;justify-content:center;margin-top:8px;}
  .mini{text-align:center;}
  .mini canvas{border:1px solid var(--line);border-radius:6px;background:var(--void);}
  .mini div{font-size:10px;color:var(--dim);margin-top:4px;}
  #valid{font-size:12px;padding:8px;border-radius:6px;margin-top:8px;}
  #valid.ok{background:#12291c;color:var(--good);} #valid.err{background:#2b1620;color:var(--bad);}
  .tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:8px;}
  .tabs button{padding:5px 10px;font-size:11px;}
  .tabs button.active{background:var(--accent);color:#111;border-color:var(--accent);}
  a.nav{color:var(--accent2);text-decoration:none;font-size:12px;letter-spacing:1px;}
</style>
</head>
<body>
<div class="ed-wrap">
  <header style="grid-column:1/-1;display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid var(--line);padding-bottom:10px;">
    <h1>LS20&nbsp;EDITOR <span>· design levels · export .json</span></h1>
    <a class="nav" href="index.html">← back to arena</a>
  </header>

  <div class="panel">
    <div class="tabs" id="tabs"></div>
    <div class="row">
      <label>Name</label><input type="text" id="lvName" placeholder="my level">
      <label>Energy</label><input type="number" id="lvEnergy" min="1" max="200" value="24" style="width:70px">
    </div>
    <div class="row">
      <label>Size</label>
      W <input type="number" id="lvW" min="3" max="24" value="11" style="width:60px">
      H <input type="number" id="lvH" min="3" max="24" value="9" style="width:60px">
      <button id="btnResize">resize</button>
      <button id="btnBorder">wall border</button>
      <button id="btnClear">clear</button>
    </div>
    <canvas id="edCanvas" width="660" height="540"></canvas>
    <div id="valid" class="ok">–</div>
  </div>

  <div class="right-col">
    <div class="panel">
      <h2>Palette <span class="small">(click cell to paint · right-click = floor)</span></h2>
      <div class="palette" id="palette"></div>
    </div>

    <div class="panel">
      <h2>Key (start) & Door (goal)</h2>
      <div class="row"><label>KEY</label>
        <span class="attr">shape <select id="keyS"></select></span>
        <span class="attr">color <select id="keyC"></select></span>
        <span class="attr">rot <select id="keyR"></select></span>
      </div>
      <div class="row"><label>DOOR</label>
        <span class="attr">shape <select id="doorS"></select></span>
        <span class="attr">color <select id="doorC"></select></span>
        <span class="attr">rot <select id="doorR"></select></span>
      </div>
      <div class="miniwrap">
        <div class="mini"><canvas id="miniKey" width="80" height="80"></canvas><div>start key</div></div>
        <div class="mini"><canvas id="miniDoor" width="80" height="80"></canvas><div>door needs</div></div>
      </div>
      <div class="small" id="reachHint" style="margin-top:8px"></div>
    </div>

    <div class="panel">
      <h2>Levels in pack</h2>
      <div class="row">
        <button id="btnAdd">+ add level</button>
        <button id="btnDup">duplicate</button>
        <button id="btnDel">delete</button>
      </div>
      <div class="row">
        <label>Pack</label><input type="text" id="packName" placeholder="pack name" value="custom_pack">
      </div>
      <div class="row">
        <button id="btnExport" class="primary">⬇ export .json</button>
        <button id="btnImport">⬆ import</button>
        <input type="file" id="fileImport" accept=".json" style="display:none">
      </div>
      <div class="row">
        <button id="btnSaveServer">save to data/levels/</button>
        <button id="btnTest" class="primary">▶ test in arena</button>
      </div>
      <div class="small" id="serverMsg"></div>
    </div>
  </div>
</div>
<script src="shapes.js"></script>
<script src="editor.js"></script>
</body>
</html>
